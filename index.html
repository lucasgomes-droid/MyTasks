<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTasks</title>
<style>
  :root{
    --bg: #171B24;
    --bg-soft: #1D222D;
    --card: #1F2530;
    --card-hover: #252C39;
    --line: #2C3342;
    --text: #ECEFF4;
    --muted: #8B93A7;
    --amber: #F5A65B;
    --amber-dark: #C97F3E;

    --baixo: #4FB0A5;
    --medio: #E8B84B;
    --alto: #E8823D;
    --urgente: #E1524B;

    --ni: #6B7385;
    --andamento: #5B8DEF;
    --finalizada: #4CAF7D;
    --atrasada: #E1524B;

    --font-display: "Avenir Next", "Segoe UI Semibold", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(245,166,91,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    padding-bottom: 60px;
  }

  /* ---------- Login screen ---------- */
  #loginScreen{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction: column;
    text-align:center;
    padding: 20px;
  }
  #loginScreen .brand h1{
    font-family: var(--font-display);
    font-size: 44px;
    letter-spacing: -1px;
    margin: 0 0 6px;
  }
  #loginScreen .brand h1 span{ color: var(--amber); }
  #loginScreen p{
    color: var(--muted);
    max-width: 360px;
    margin: 0 0 32px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .gh-btn{
    display:flex;
    align-items:center;
    gap: 10px;
    background: #ECEFF4;
    color: #171B24;
    border: none;
    padding: 13px 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .gh-btn:hover{ background: #fff; }
  .gh-btn svg{ width: 20px; height: 20px; }
  #loginError{
    color: var(--urgente);
    font-size: 13px;
    margin-top: 16px;
    min-height: 18px;
  }
  #loginStatus{
    color: var(--muted);
    font-size: 13px;
    margin-top: 16px;
  }

  #app{ display:none; }
  #app.ready{ display:block; }

  header{
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 24px 0;
  }

  .topbar{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 6px;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:14px;
  }

  .brand h1{
    font-family: var(--font-display);
    font-size: 34px;
    letter-spacing: -0.5px;
    margin: 0;
  }
  .brand h1 span{ color: var(--amber); }

  .brand .tag{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 4px 8px;
    border-radius: 4px;
  }

  .user-chip{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px 6px 6px;
  }
  .user-chip img{
    width: 26px; height: 26px; border-radius: 50%;
  }
  .user-chip span{
    font-size: 13px;
    color: var(--text);
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .user-chip button{
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-body);
    padding: 4px 8px;
    border-radius: 999px;
  }
  .user-chip button:hover{ background: var(--line); color: var(--text); }

  .sync-note{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
  }
  .sync-note .dot-live{
    width:6px; height:6px; border-radius:50%; background: var(--finalizada);
    display:inline-block; margin-right:6px;
  }

  .tabs{
    display:flex;
    gap: 6px;
    margin-top: 22px;
  }
  .tab{
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    background: var(--bg-soft);
    color: var(--muted);
    border: 1px solid var(--line);
    border-bottom: none;
    padding: 12px 22px 10px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  .tab .count{
    font-family: var(--font-mono);
    font-size: 11px;
    margin-left: 8px;
    color: var(--muted);
  }
  .tab.active{
    background: var(--card);
    color: var(--text);
    border-color: var(--line);
  }
  .tab.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background: var(--card);
  }

  main{
    max-width: 980px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0 12px 12px 12px;
    padding: 28px 24px 36px;
  }

  .toolbar{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items:center;
    margin-bottom: 22px;
  }

  input[type=text], input[type=search], input[type=date], select, textarea{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  input[type=text]:focus, input[type=search]:focus, input[type=date]:focus, select:focus, textarea:focus{
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }

  .search{ flex: 1 1 220px; }
  .sort{ flex: 0 0 auto; }

  .btn{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover{ background: var(--card-hover); }
  .btn-primary{
    background: var(--amber);
    border-color: var(--amber);
    color: #201205;
  }
  .btn-primary:hover{ background: var(--amber-dark); border-color: var(--amber-dark); }
  .btn-ghost{
    background: transparent;
  }
  .btn-sm{ padding: 6px 10px; font-size: 12px; }

  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom: 20px;
  }
  .pill{
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 16px 14px;
    position: relative;
    border-left: 4px solid var(--muted);
    transition: transform .12s ease, background .12s ease;
  }
  .card:hover{ background: var(--card-hover); }

  .card-title{
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 6px;
    padding-right: 60px;
  }
  .card-title mark, .card-desc mark{
    background: rgba(245,166,91,0.35);
    color: var(--text);
    border-radius: 3px;
    padding: 0 1px;
  }
  .card-desc{
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 12px;
    white-space: pre-wrap;
  }

  .badge{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 5px;
    display:inline-block;
  }
  .badge-atrasada{
    background: rgba(225,82,75,0.16);
    color: var(--atrasada);
  }
  .badge-prazo{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
  }

  .card-meta-row{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .card-footer{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .status-select{
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 8px;
  }

  .card-actions{
    position:absolute;
    top: 12px;
    right: 12px;
    display:flex;
    gap: 4px;
  }
  .icon-btn{
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 6px;
    line-height:1;
  }
  .icon-btn:hover{ background: var(--line); color: var(--text); }

  /* Checklist */
  .checklist-toggle{
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 10px;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .checklist-toggle:hover{ color: var(--text); border-color: var(--amber); }
  .checklist-toggle .bar{
    width: 40px; height: 4px; border-radius: 2px; background: var(--line); overflow:hidden;
  }
  .checklist-toggle .bar > span{ display:block; height:100%; background: var(--finalizada); }

  .checklist-panel{
    display:none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .checklist-panel.open{ display:block; }
  .checklist-item{
    display:flex;
    align-items:flex-start;
    gap: 8px;
    padding: 4px 0;
    font-size: 13px;
  }
  .checklist-item input[type=checkbox]{
    margin-top: 3px;
    accent-color: var(--amber);
    cursor:pointer;
  }
  .checklist-item .txt{ flex:1; word-break: break-word; }
  .checklist-item .txt.done{ color: var(--muted); text-decoration: line-through; }
  .checklist-item .rm{
    background:transparent; border:none; color: var(--muted); cursor:pointer; font-size: 12px; padding: 2px 4px;
  }
  .checklist-item .rm:hover{ color: var(--urgente); }
  .checklist-add{
    display:flex;
    gap: 6px;
    margin-top: 6px;
  }
  .checklist-add input{
    flex:1;
    font-size: 12.5px;
    padding: 7px 10px;
  }

  .empty{
    text-align:center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .big{
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .overlay{
    position: fixed;
    inset:0;
    background: rgba(10,12,16,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
    overflow-y: auto;
  }
  .overlay.open{ display:flex; }

  .modal{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px;
    width: 100%;
    max-width: 440px;
    margin: auto;
  }
  .modal h2{
    font-family: var(--font-display);
    margin: 0 0 18px;
    font-size: 20px;
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .field input, .field select, .field textarea{ width:100%; }
  .field textarea{ resize: vertical; min-height: 70px; }
  .field-row{ display:flex; gap: 10px; }
  .field-row .field{ flex:1; }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top: 20px;
  }

  #fileInput{ display:none; }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 10px 10px 16px;
    border-radius: 8px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .toast.show{ opacity:1; pointer-events:auto; transform: translateX(-50%) translateY(-6px); }
  .toast button{
    background: var(--amber);
    color: #201205;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font-body);
    white-space: nowrap;
  }

  @media (max-width: 560px){
    header{ padding: 24px 14px 0; }
    main{ padding: 20px 14px 28px; border-radius: 0 10px 10px 10px; }
    .brand h1{ font-size: 26px; }
    .topbar{ flex-direction: column; align-items:flex-start; gap: 14px; }
    .field-row{ flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen">
  <div class="brand"><h1>My<span>Tasks</span></h1></div>
  <p>Suas atividades e pendências, salvas na nuvem e sincronizadas em qualquer dispositivo. Entre com sua conta do GitHub para continuar.</p>
  <button class="gh-btn" id="loginBtn">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    Entrar com GitHub
  </button>
  <div id="loginStatus"></div>
  <div id="loginError"></div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="topbar">
      <div class="brand">
        <h1>My<span>Tasks</span></h1>
        <span class="tag">painel pessoal</span>
      </div>
      <div class="user-chip">
        <img id="userAvatar" src="" alt="">
        <span id="userName"></span>
        <button onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="sync-note"><span class="dot-live"></span><span id="syncText">sincronizado na nuvem</span></div>

    <div class="tabs">
      <button class="tab active" id="tabAtividades" onclick="setTab('atividades')">
        Atividades <span class="count" id="countAtividades">0</span>
      </button>
      <button class="tab" id="tabPendencias" onclick="setTab('pendencias')">
        Pendências <span class="count" id="countPendencias">0</span>
      </button>
      <button class="tab" id="tabFinalizadas" onclick="setTab('finalizadas')">
        Finalizadas <span class="count" id="countFinalizadas">0</span>
      </button>
    </div>
  </header>

  <main>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="search" class="search" id="searchInput" placeholder="Buscar por título ou descrição..." oninput="render()">
      <select class="sort" id="sortSelect" onchange="render()">
        <option value="criterio">Ordenar: critério</option>
        <option value="prazo">Ordenar: prazo</option>
        <option value="recente">Ordenar: mais recente</option>
        <option value="titulo">Ordenar: título (A-Z)</option>
      </select>
      <select class="sort" id="criterioFilter" onchange="render()">
        <option value="">Critério: todos</option>
        <option value="URGENTE">Urgente</option>
        <option value="ALTO">Alto</option>
        <option value="MEDIO">Médio</option>
        <option value="BAIXO">Baixo</option>
      </select>
      <button class="btn btn-primary" id="addBtn" onclick="openForm()">+ Nova</button>
      <button class="btn" onclick="exportJSON()">Exportar JSON</button>
      <button class="btn" onclick="exportCSV()">Exportar CSV</button>
      <button class="btn" onclick="document.getElementById('fileInput').click()">Importar JSON</button>
      <input type="file" id="fileInput" accept="application/json" onchange="importJSON(event)">
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyState" style="display:none">
      <div class="big" id="emptyTitle">Nada por aqui ainda</div>
      <div id="emptySub">Clique em "+ Nova" para começar.</div>
    </div>

  </main>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this) closeForm()">
  <div class="modal">
    <h2 id="modalTitle">Nova Atividade</h2>
    <div class="field">
      <label>Título</label>
      <input type="text" id="fTitulo" placeholder="Digite o título">
    </div>
    <div class="field">
      <label>Descrição</label>
      <textarea id="fDescricao" placeholder="Descreva com detalhes"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Critério</label>
        <select id="fCriterio">
          <option value="BAIXO">Baixo</option>
          <option value="MEDIO">Médio</option>
          <option value="ALTO">Alto</option>
          <option value="URGENTE">Urgente</option>
        </select>
      </div>
      <div class="field" id="statusField">
        <label>Status</label>
        <select id="fStatus">
          <option value="NÃO INICIADO">Não iniciado</option>
          <option value="EM ANDAMENTO">Em andamento</option>
          <option value="FINALIZADA">Finalizada</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Prazo (opcional)</label>
      <input type="date" id="fPrazo">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveForm()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GithubAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtJWm5pRiPUdXYrlGqVmGBxx3cPoEBBFQ",
    authDomain: "my-tasks-fa415.firebaseapp.com",
    projectId: "my-tasks-fa415",
    storageBucket: "my-tasks-fa415.firebasestorage.app",
    messagingSenderId: "164502992036",
    appId: "1:164502992036:web:493cf74c1409a71a82a231",
    measurementId: "G-5EEFBQVKX0"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  let currentUser = null;
  let unsubscribeDoc = null;
  let suppressNextSave = false;

  document.getElementById('loginBtn').addEventListener('click', () => {
    const provider = new GithubAuthProvider();
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginStatus').textContent = 'Abrindo login do GitHub...';
    signInWithPopup(auth, provider).catch(err => {
      document.getElementById('loginStatus').textContent = '';
      document.getElementById('loginError').textContent = 'Não foi possível entrar: ' + (err.code || err.message);
    });
  });

  window.logout = function(){ signOut(auth); };

  onAuthStateChanged(auth, (user) => {
    if (unsubscribeDoc){ unsubscribeDoc(); unsubscribeDoc = null; }

    if (user){
      currentUser = user;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('ready');
      document.getElementById('userAvatar').src = user.photoURL || '';
      document.getElementById('userName').textContent = user.displayName || user.email || 'Usuário';

      const userDocRef = doc(db, 'users', user.uid);
      unsubscribeDoc = onSnapshot(userDocRef, (snap) => {
        suppressNextSave = true;
        if (snap.exists()){
          const data = snap.data();
          window.__state.atividades = (data.atividades || []).map(hydrate);
          window.__state.pendencias = (data.pendencias || []).map(hydrate);
        } else {
          window.__state.atividades = [];
          window.__state.pendencias = [];
        }
        window.__render();
        document.getElementById('syncText').textContent = 'sincronizado na nuvem';
      }, (err) => {
        document.getElementById('syncText').textContent = 'erro ao sincronizar: verifique as regras do Firestore';
      });

    } else {
      currentUser = null;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('app').classList.remove('ready');
      document.getElementById('loginStatus').textContent = '';
    }
  });

  function hydrate(item){
    const base = { id: window.__uid(), _ts: Date.now(), prazo: '', checklist: [] };
    return Object.assign(base, item);
  }

  let saveTimer = null;
  window.__saveToCloud = function(immediate){
    if (suppressNextSave){ suppressNextSave = false; return; }
    if (!currentUser) return;

    clearTimeout(saveTimer);
    const doSave = () => {
      const userDocRef = doc(db, 'users', currentUser.uid);
      document.getElementById('syncText').textContent = 'salvando...';
      setDoc(userDocRef, {
        atividades: window.__state.atividades.map(a => ({
          titulo: a.titulo, descricao: a.descricao, criterio: a.criterio, prazo: a.prazo || '', checklist: a.checklist || []
        })),
        pendencias: window.__state.pendencias.map(p => ({
          titulo: p.titulo, descricao: p.descricao, criterio: p.criterio, status: p.status, prazo: p.prazo || '', checklist: p.checklist || []
        }))
      }).then(() => {
        document.getElementById('syncText').textContent = 'sincronizado na nuvem';
      }).catch(() => {
        document.getElementById('syncText').textContent = 'falha ao salvar — tente novamente';
      });
    };

    if (immediate){ doSave(); } else { saveTimer = setTimeout(doSave, 600); }
  };
</script>

<script>
  // ---------- state ----------
  let state = {
    atividades: [],
    pendencias: [],
    tab: 'atividades',
    editingId: null,
    openChecklists: {}   // id -> true/false, remembers which cards have the checklist expanded
  };
  window.__state = state;

  const CRITERIO_META = {
    BAIXO:   {label:'Baixo',   color:'var(--baixo)'},
    MEDIO:   {label:'Médio',   color:'var(--medio)'},
    ALTO:    {label:'Alto',    color:'var(--alto)'},
    URGENTE: {label:'Urgente', color:'var(--urgente)'}
  };
  const CRITERIO_ORDER = ['URGENTE','ALTO','MEDIO','BAIXO'];

  const STATUS_META = {
    'NÃO INICIADO': {label:'Não iniciado', color:'var(--ni)'},
    'EM ANDAMENTO': {label:'Em andamento', color:'var(--andamento)'},
    'FINALIZADA':   {label:'Finalizada',   color:'var(--finalizada)'}
  };

  function uid(){ return 'id' + Math.random().toString(36).slice(2, 10); }
  window.__uid = uid;

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function isOverdue(item){
    return item.prazo && item.prazo < todayStr() && item.status !== 'FINALIZADA';
  }
  function formatPrazo(p){
    const [y,m,d] = p.split('-');
    return d + '/' + m + '/' + y;
  }

  // ---------- helpers ----------
  function isPendenciaTab(){ return state.tab === 'pendencias' || state.tab === 'finalizadas'; }
  function getUnderlyingList(){ return state.tab === 'atividades' ? state.atividades : state.pendencias; }

  // ---------- tabs ----------
  function setTab(tab){
    state.tab = tab;
    document.getElementById('tabAtividades').classList.toggle('active', tab==='atividades');
    document.getElementById('tabPendencias').classList.toggle('active', tab==='pendencias');
    document.getElementById('tabFinalizadas').classList.toggle('active', tab==='finalizadas');

    const addBtn = document.getElementById('addBtn');
    if (tab === 'atividades'){ addBtn.textContent = '+ Nova Atividade'; addBtn.style.display = 'inline-block'; }
    else if (tab === 'pendencias'){ addBtn.textContent = '+ Nova Pendência'; addBtn.style.display = 'inline-block'; }
    else { addBtn.style.display = 'none'; }

    document.getElementById('criterioFilter').value = '';
    render();
  }
  window.setTab = setTab;

  // ---------- render ----------
  function render(){
    let items;
    if (state.tab === 'atividades'){
      items = state.atividades.slice();
    } else if (state.tab === 'pendencias'){
      items = state.pendencias.filter(p => p.status !== 'FINALIZADA');
    } else {
      items = state.pendencias.filter(p => p.status === 'FINALIZADA');
    }

    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const sortMode = document.getElementById('sortSelect').value;
    const criterioFilter = document.getElementById('criterioFilter').value;

    items = items.filter(i =>
      i.titulo.toLowerCase().includes(query) || (i.descricao || '').toLowerCase().includes(query)
    );
    if (criterioFilter){
      items = items.filter(i => i.criterio === criterioFilter);
    }

    if (sortMode === 'criterio'){
      items.sort((a,b) => CRITERIO_ORDER.indexOf(a.criterio) - CRITERIO_ORDER.indexOf(b.criterio));
    } else if (sortMode === 'titulo'){
      items.sort((a,b) => a.titulo.localeCompare(b.titulo));
    } else if (sortMode === 'prazo'){
      items.sort((a,b) => {
        if (!a.prazo && !b.prazo) return 0;
        if (!a.prazo) return 1;
        if (!b.prazo) return -1;
        return a.prazo.localeCompare(b.prazo);
      });
    } else {
      items.sort((a,b) => (b._ts||0) - (a._ts||0));
    }

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    document.getElementById('emptyState').style.display = items.length ? 'none' : 'block';
    const noFilterActive = !query && !criterioFilter;
    let emptyTitleText;
    if (!noFilterActive){
      emptyTitleText = 'Nenhum resultado';
    } else if (state.tab === 'atividades'){
      emptyTitleText = 'Nenhuma atividade cadastrada';
    } else if (state.tab === 'pendencias'){
      emptyTitleText = 'Nenhuma pendência em aberto';
    } else {
      emptyTitleText = 'Nenhuma pendência finalizada ainda';
    }
    document.getElementById('emptyTitle').textContent = emptyTitleText;
    document.getElementById('emptySub').textContent = noFilterActive
      ? (state.tab === 'finalizadas' ? 'Itens marcados como "Finalizada" aparecem aqui.' : 'Clique em "+ Nova" para começar.')
      : 'Tente outro termo de busca ou critério.';

    items.forEach(item => grid.appendChild(buildCard(item, query)));

    document.getElementById('countAtividades').textContent = state.atividades.length;
    document.getElementById('countPendencias').textContent = state.pendencias.filter(p => p.status !== 'FINALIZADA').length;
    document.getElementById('countFinalizadas').textContent = state.pendencias.filter(p => p.status === 'FINALIZADA').length;

    renderStats();
  }
  window.__render = render;

  function escapeHTML(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function escapeRegex(str){ return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function highlight(str, query){
    const safe = escapeHTML(str);
    if (!query) return safe;
    const re = new RegExp(escapeRegex(escapeHTML(query)), 'ig');
    return safe.replace(re, m => '<mark>' + m + '</mark>');
  }

  function buildCard(item, query){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = item.id;
    card.style.borderLeftColor = isOverdue(item) ? 'var(--atrasada)' : CRITERIO_META[item.criterio].color;

    const criterioBadge = `<span class="badge" style="background:${CRITERIO_META[item.criterio].color}22; color:${CRITERIO_META[item.criterio].color}">${CRITERIO_META[item.criterio].label}</span>`;
    const overdueBadge = isOverdue(item) ? `<span class="badge badge-atrasada">Atrasada</span>` : '';
    const prazoBadge = item.prazo ? `<span class="badge badge-prazo">${isOverdue(item) ? '⚠' : '📅'} ${formatPrazo(item.prazo)}</span>` : '';

    let footerRight = '';
    if (isPendenciaTab()){
      const opts = Object.keys(STATUS_META).map(s =>
        `<option value="${s}" ${s===item.status?'selected':''}>${STATUS_META[s].label}</option>`
      ).join('');
      footerRight = `<select class="status-select" style="color:${STATUS_META[item.status].color}; border-color:${STATUS_META[item.status].color}55" onchange="changeStatus('${item.id}', this.value)">${opts}</select>`;
    }

    const checklist = item.checklist || [];
    const doneCount = checklist.filter(c => c.feito).length;
    const isOpen = !!state.openChecklists[item.id];
    const pct = checklist.length ? Math.round((doneCount / checklist.length) * 100) : 0;

    const checklistToggle = `
      <button class="checklist-toggle" onclick="toggleChecklist('${item.id}')">
        ☑ ${doneCount}/${checklist.length}
        <span class="bar"><span style="width:${pct}%"></span></span>
      </button>`;

    const checklistItemsHtml = checklist.map(c => `
      <div class="checklist-item">
        <input type="checkbox" ${c.feito ? 'checked' : ''} onchange="toggleChecklistItem('${item.id}','${c.id}')">
        <span class="txt ${c.feito ? 'done' : ''}">${escapeHTML(c.texto)}</span>
        <button class="rm" onclick="removeChecklistItem('${item.id}','${c.id}')" title="Remover">✕</button>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="card-actions">
        <button class="icon-btn" title="Editar" onclick="openForm('${item.id}')">✎</button>
        <button class="icon-btn" title="Excluir" onclick="deleteItem('${item.id}')">✕</button>
      </div>
      <div class="card-title">${highlight(item.titulo, query)}</div>
      <div class="card-desc">${item.descricao ? highlight(item.descricao, query) : '<em>Sem descrição</em>'}</div>
      <div class="card-meta-row">${criterioBadge}${overdueBadge}${prazoBadge}</div>
      <div class="card-footer">
        ${checklistToggle}
        ${footerRight}
      </div>
      <div class="checklist-panel ${isOpen ? 'open' : ''}" id="checklist-${item.id}">
        ${checklistItemsHtml}
        <div class="checklist-add">
          <input type="text" placeholder="Adicionar item..." onkeydown="if(event.key==='Enter'){addChecklistItem('${item.id}', this); event.preventDefault();}">
          <button class="btn btn-sm" onclick="addChecklistItem('${item.id}', this.previousElementSibling)">+</button>
        </div>
      </div>
    `;
    return card;
  }

  function renderStats(){
    const box = document.getElementById('stats');
    box.innerHTML = '';
    if (state.tab === 'atividades'){
      CRITERIO_ORDER.forEach(c => {
        const n = state.atividades.filter(a => a.criterio === c).length;
        box.innerHTML += `<span class="pill"><span class="dot" style="background:${CRITERIO_META[c].color}"></span>${CRITERIO_META[c].label}: ${n}</span>`;
      });
    } else if (state.tab === 'pendencias'){
      ['NÃO INICIADO','EM ANDAMENTO'].forEach(s => {
        const n = state.pendencias.filter(p => p.status === s).length;
        box.innerHTML += `<span class="pill"><span class="dot" style="background:${STATUS_META[s].color}"></span>${STATUS_META[s].label}: ${n}</span>`;
      });
      const overdueCount = state.pendencias.filter(p => isOverdue(p)).length;
      box.innerHTML += `<span class="pill"><span class="dot" style="background:var(--atrasada)"></span>Atrasadas: ${overdueCount}</span>`;
    } else {
      const finalizadas = state.pendencias.filter(p => p.status === 'FINALIZADA');
      CRITERIO_ORDER.forEach(c => {
        const n = finalizadas.filter(p => p.criterio === c).length;
        box.innerHTML += `<span class="pill"><span class="dot" style="background:${CRITERIO_META[c].color}"></span>${CRITERIO_META[c].label}: ${n}</span>`;
      });
    }
  }

  // ---------- checklist ----------
  function toggleChecklist(id){
    state.openChecklists[id] = !state.openChecklists[id];
    const panel = document.getElementById('checklist-' + id);
    if (panel) panel.classList.toggle('open', state.openChecklists[id]);
  }
  window.toggleChecklist = toggleChecklist;

  function findItem(id){
    return state.atividades.find(i => i.id === id) || state.pendencias.find(i => i.id === id);
  }

  function addChecklistItem(itemId, inputEl){
    const texto = inputEl.value.trim();
    if (!texto) return;
    const item = findItem(itemId);
    if (!item) return;
    if (!item.checklist) item.checklist = [];
    item.checklist.push({ id: uid(), texto, feito: false });
    inputEl.value = '';
    state.openChecklists[itemId] = true;
    render();
    persist();
  }
  window.addChecklistItem = addChecklistItem;

  function toggleChecklistItem(itemId, checkId){
    const item = findItem(itemId);
    if (!item) return;
    const c = (item.checklist || []).find(c => c.id === checkId);
    if (c){ c.feito = !c.feito; state.openChecklists[itemId] = true; render(); persist(); }
  }
  window.toggleChecklistItem = toggleChecklistItem;

  function removeChecklistItem(itemId, checkId){
    const item = findItem(itemId);
    if (!item) return;
    item.checklist = (item.checklist || []).filter(c => c.id !== checkId);
    state.openChecklists[itemId] = true;
    render();
    persist();
  }
  window.removeChecklistItem = removeChecklistItem;

  // ---------- status change ----------
  function changeStatus(id, newStatus){
    const item = state.pendencias.find(p => p.id === id);
    if (item){ item.status = newStatus; render(); persist(); showToast('Status atualizado'); }
  }
  window.changeStatus = changeStatus;

  // ---------- delete with undo ----------
  let lastDeleted = null;
  function deleteItem(id){
    const list = getUnderlyingList();
    const idx = list.findIndex(i => i.id === id);
    if (idx === -1) return;
    lastDeleted = { list, item: list[idx], index: idx };
    list.splice(idx, 1);
    render();
    showToast('Item removido', 'Desfazer', undoDelete);
    persist();
  }
  window.deleteItem = deleteItem;

  function undoDelete(){
    if (!lastDeleted) return;
    lastDeleted.list.splice(lastDeleted.index, 0, lastDeleted.item);
    lastDeleted = null;
    render();
    persist();
    showToast('Restaurado');
  }

  // ---------- form ----------
  function openForm(id){
    state.editingId = id || null;
    const isPendencia = isPendenciaTab();
    document.getElementById('statusField').style.display = isPendencia ? 'block' : 'none';

    if (id){
      const list = getUnderlyingList();
      const item = list.find(i => i.id === id);
      document.getElementById('modalTitle').textContent = isPendencia ? 'Editar Pendência' : 'Editar Atividade';
      document.getElementById('fTitulo').value = item.titulo;
      document.getElementById('fDescricao').value = item.descricao;
      document.getElementById('fCriterio').value = item.criterio;
      document.getElementById('fPrazo').value = item.prazo || '';
      if (isPendencia) document.getElementById('fStatus').value = item.status;
    } else {
      document.getElementById('modalTitle').textContent = isPendencia ? 'Nova Pendência' : 'Nova Atividade';
      document.getElementById('fTitulo').value = '';
      document.getElementById('fDescricao').value = '';
      document.getElementById('fCriterio').value = 'BAIXO';
      document.getElementById('fPrazo').value = '';
      document.getElementById('fStatus').value = 'NÃO INICIADO';
    }

    document.getElementById('overlay').classList.add('open');
    document.getElementById('fTitulo').focus();
  }
  window.openForm = openForm;

  function closeForm(){
    document.getElementById('overlay').classList.remove('open');
    state.editingId = null;
  }
  window.closeForm = closeForm;

  function saveForm(){
    const titulo = document.getElementById('fTitulo').value.trim();
    if (!titulo){ document.getElementById('fTitulo').focus(); return; }
    const descricao = document.getElementById('fDescricao').value.trim();
    const criterio = document.getElementById('fCriterio').value;
    const prazo = document.getElementById('fPrazo').value;
    const isPendencia = isPendenciaTab();
    const status = document.getElementById('fStatus').value;

    const list = getUnderlyingList();

    if (state.editingId){
      const item = list.find(i => i.id === state.editingId);
      item.titulo = titulo; item.descricao = descricao; item.criterio = criterio; item.prazo = prazo;
      if (isPendencia) item.status = status;
    } else {
      const novo = { id: uid(), titulo, descricao, criterio, prazo, _ts: Date.now(), checklist: [] };
      if (isPendencia) novo.status = status;
      list.push(novo);
    }

    closeForm();
    render();
    persist(true);
    showToast('Salvo com sucesso');
  }
  window.saveForm = saveForm;

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeForm();
  });

  function persist(immediate){
    if (window.__saveToCloud) window.__saveToCloud(immediate);
  }

  // ---------- import / export ----------
  function exportJSON(){
    const data = {
      atividades: state.atividades.map(a => [a.titulo, a.descricao, a.criterio]),
      pendencias: state.pendencias.map(p => [p.titulo, p.descricao, p.criterio, p.status])
    };
    downloadBlob(JSON.stringify(data, null, 2), 'application/json', 'mytasks_dados.json');
    showToast('Arquivo exportado');
  }
  window.exportJSON = exportJSON;

  function csvEscape(v){
    const s = String(v == null ? '' : v);
    if (/[",\n;]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function exportCSV(){
    const rows = [['tipo','titulo','descricao','criterio','status','prazo']];
    state.atividades.forEach(a => rows.push(['atividade', a.titulo, a.descricao, a.criterio, '', a.prazo || '']));
    state.pendencias.forEach(p => rows.push(['pendencia', p.titulo, p.descricao, p.criterio, p.status, p.prazo || '']));
    const csv = rows.map(r => r.map(csvEscape).join(';')).join('\n');
    downloadBlob('\uFEFF' + csv, 'text/csv;charset=utf-8', 'mytasks_dados.csv');
    showToast('CSV exportado');
  }
  window.exportCSV = exportCSV;

  function downloadBlob(content, mime, filename){
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function importJSON(event){
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        applyImported(parsed);
        showToast('Dados importados');
      } catch (err) {
        showToast('Arquivo inválido');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }
  window.importJSON = importJSON;

  function applyImported(parsed){
    let ativRaw = null, pendRaw = null;

    if (Array.isArray(parsed)){
      if (parsed.length === 0){ ativRaw = []; }
      else if (parsed[0].length === 4){ pendRaw = parsed; }
      else { ativRaw = parsed; }
    } else if (parsed && typeof parsed === 'object'){
      ativRaw = parsed.atividades || null;
      pendRaw = parsed.pendencias || null;
    }

    if (ativRaw){
      state.atividades = ativRaw.map(row => ({
        id: uid(), titulo: row[0] || '', descricao: row[1] || '', criterio: row[2] || 'BAIXO', _ts: Date.now(), prazo: '', checklist: []
      }));
    }
    if (pendRaw){
      state.pendencias = pendRaw.map(row => ({
        id: uid(), titulo: row[0] || '', descricao: row[1] || '', criterio: row[2] || 'BAIXO', status: row[3] || 'NÃO INICIADO', _ts: Date.now(), prazo: '', checklist: []
      }));
    }
    render();
    persist(true);
  }

  // ---------- toast ----------
  let toastTimer;
  function showToast(msg, actionLabel, actionFn){
    const t = document.getElementById('toast');
    const msgEl = document.getElementById('toastMsg');
    msgEl.textContent = msg;

    const oldBtn = t.querySelector('button');
    if (oldBtn) oldBtn.remove();

    if (actionLabel && actionFn){
      const btn = document.createElement('button');
      btn.textContent = actionLabel;
      btn.onclick = () => { actionFn(); t.classList.remove('show'); clearTimeout(toastTimer); };
      t.appendChild(btn);
    }

    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 4500 : 1800);
  }

  // ---------- init ----------
  render();
</script>

</body>
